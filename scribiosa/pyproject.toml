[project]
name = "scribiosa"
version = "0.1.0"
description = "Build linked Markdown documents as HTML, DOCX, or PDF."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "markdown-it-py>=3,<5",
]

[project.scripts]
scribiosa = "scribiosa.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=0.25",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribiosa"]
artifacts = ["src/scribiosa/link-target.lua"]

[tool.ruff]
line-length = 100
target-version = "py312"